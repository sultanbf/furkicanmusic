<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Furkicanmusic Studio — Geçmiş</title>
  <meta name="description" content="Oluşturduğunuz tüm müzikler burada listelenir." />
  <link rel="stylesheet" href="assets/css/style.css?v=8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
</head>
<body>
  <div class="container">
    <h1 class="page-title">Geçmiş Müzikleriniz</h1>
    <p class="page-sub">Oluşturduğunuz tüm müzikler burada listelenir</p>

    <div class="card" style="margin-bottom: 20px">
      <div class="btn-row" style="margin-top: 0; justify-content: space-between; align-items: center">
        <span id="historyCount" style="color: var(--text-dim); font-size: 0.9rem">0 müzik</span>
        <button class="btn btn-danger btn-sm" id="clearAllBtn">🗑️ Tümünü Sil</button>
      </div>
    </div>

    <div id="historyList"></div>

    <div id="emptyState" class="empty-state hidden">
      <div class="big">🎶</div>
      <h3>Henüz müzik oluşturmadınız</h3>
      <p style="margin: 8px 0 18px">Dashboard'dan yeni müzik oluşturarak geçmişinizi doldurun.</p>
      <a href="index.html" class="btn btn-primary" style="width: auto">🎵 Müzik Oluştur</a>
    </div>
  </div>

  <script src="assets/js/keys.js?v=2"></script>
  <script src="assets/js/common.js?v=10"></script>
  <script>
    renderShell("/history.html");

    const listEl = document.getElementById("historyList");
    const emptyEl = document.getElementById("emptyState");
    const countEl = document.getElementById("historyCount");

    /* Paylaşım platformları (marka ikonları inline SVG) */
    const SHARE_META = {
      wa: { label: "WhatsApp", cls: "share-wa", icon: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>' },
      tg: { label: "Telegram", cls: "share-tg", icon: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.944 0A12 12 0 000 12a12 12 0 0012 12 12 12 0 0012-12A12 12 0 0012 0a12 12 0 00-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 01.171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>' },
      ig: { label: "Instagram", cls: "share-ig", icon: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zm0 10.162a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>' },
      yt: { label: "YouTube", cls: "share-yt", icon: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.498 6.186a3.016 3.016 0 00-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 00.502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 002.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 002.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>' },
    };

    function render() {
      const items = History.getAll();
      countEl.textContent = `${items.length} müzik`;
      emptyEl.classList.toggle("hidden", items.length > 0);
      listEl.innerHTML = "";

      items.forEach((item) => {
        const row = document.createElement("div");
        row.className = "history-item";
        const date = new Date(item.createdAt).toLocaleString("tr-TR", { dateStyle: "medium", timeStyle: "short" });
        const badge = item.provider === "suno" ? "✨ Suno API" : "🔗 n8n";

        row.innerHTML = `
          <div class="h-cover">
            ${item.imageUrl && item.imageUrl !== "assets/img/cover-placeholder.svg"
              ? `<img src="${item.imageUrl}" alt="" style="width:100%;height:100%;border-radius:10px;object-fit:cover" onerror="this.remove()" />`
              : "🎵"}
          </div>
          <div class="h-info">
            <h5>${item.title || "Şarkı"} <span style="font-size:0.7rem;color:var(--text-dim)">${badge}${item.isVideo ? " 🎬" : ""}</span></h5>
            <p>${item.tags || "—"} · ${date}</p>
          </div>
          <div class="h-actions">
            ${Object.entries(SHARE_META).map(([k, m]) => `
              <button class="share-btn ${m.cls}" title="${m.label} üzerinden paylaş" onclick="shareSong(this, '${k}')" data-audio="${item.audioUrl}" data-title="${String(item.title || "").replace(/["']/g, "")}">${m.icon}</button>`).join("")}
            <button class="btn btn-ghost btn-sm" onclick="playItem(this)" data-audio="${item.audioUrl}" data-video="${item.isVideo ? "1" : ""}" data-title="${String(item.title || "").replace(/["']/g, "")}" data-image="${String(item.imageUrl || "").replace(/["']/g, "")}">▶️</button>
            <button class="btn btn-danger btn-sm" onclick="deleteItem('${item.id}')">✖</button>
          </div>`;
        listEl.appendChild(row);
      });
    }

    window.playItem = function (btn) {
      const url = btn.dataset.audio;
      if (!url) return;
      Player.play({
        url,
        isVideo: btn.dataset.video === "1",
        title: btn.dataset.title || "Şarkı",
        imageUrl: btn.dataset.image || "",
      });
      toast("🎵 Çalıyor — diğer sayfalara geçseniz de devam eder", "info", 2500);
    };

    window.shareSong = function (btn, platform) {
      const url = btn.dataset.audio;
      const title = btn.dataset.title || "Şarkı";
      if (!url) return;
      const text = "🎵 " + title;
      const open = (u) => window.open(u, "_blank", "noopener");
      if (platform === "wa") {
        open("https://wa.me/?text=" + encodeURIComponent(text + "\n" + url));
      } else if (platform === "tg") {
        open("https://t.me/share/url?url=" + encodeURIComponent(url) + "&text=" + encodeURIComponent(text));
      } else if (platform === "ig") {
        copyText(url);
        open("https://www.instagram.com/");
        toast("Bağlantı kopyalandı — Instagram'da yapıştırabilirsin", "info", 3500);
      } else if (platform === "yt") {
        copyText(url);
        open("https://www.youtube.com/");
        toast("Bağlantı kopyalandı — YouTube'da paylaşabilirsin", "info", 3500);
      }
    };

    window.deleteItem = function (id) {
      History.remove(id);
      render();
      toast("Kayıt silindi", "info");
    };

    document.getElementById("clearAllBtn").addEventListener("click", () => {
      if (!confirm("Tüm geçmiş silinsin mi?")) return;
      History.clear();
      render();
      toast("Geçmiş temizlendi", "success");
    });

    render();
  </script>
</body>
</html>
